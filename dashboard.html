<!DOCTYPE html>
<html>
<head>
  <title>GreenPrompt Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="chart.min.js"></script>


</head>
<body>
  <div class="header">
    <!-- <h1>🌿 GreenPrompt</h1> -->
    <h1>&#127793; GreenPrompt</h1>
    
    <p>Your AI Sustainability Companion</p>
  </div>

  <div class="stats">

    <div class="card">
      <h2 id="tokensSaved">0</h2>
      <p>Tokens Saved</p>
    </div>

    <div class="card">
      <h2 id="energySaved">0</h2>
      <p>Energy Saved (Wh)</p>
    </div>

    <div class="card">
      <h2 id="costSaved">$0</h2>
      <p>Cost Saved</p>
    </div>

  </div>

  <div class="equivalent">
    <p id="equivalentText"></p>
  </div>

    <div class="charts-section">
        <h2>Monthly Impact Overview</h2>

        <div class="chart-container">
            <canvas id="tokensChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="energyChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="costChart"></canvas>
        </div>
    </div>


  <button id="resetBtn">Reset Data</button>

  <script src="dashboard.js"></script>
</body>
</html>
